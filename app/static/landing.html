<style>
/* Tepada vertikal almashadigan sahnalar va katta serif sarlavha (oxirgi 3 eʼlon);
   pastda yangiliklar, oʻzgarishlar jurnali va maʼlumot boʻlimlari. Eʼlonlar pastdagi ITEMS roʻyxatida. */
:root {
  --bg: #EFE9E3;
  --surface: #FFFFFF;
  --surface-2: #F9F8F6;
  --line: #D9CFC7;
  --fg: #2B241D;
  --muted: #6E6256;
  --accent: #C9B59C;
  --accent-strong: #6B5A44;
  --accent-soft: #EFE9E3;
  --on-accent: #2B241D;
  --ink: #2B241D;
  --on-ink: #F9F8F6;
  --shadow: 0 24px 60px -30px rgba(43,36,29,.35), 0 2px 6px rgba(43,36,29,.06);
  --ld-sky: #F9F8F6; --ld-1: #EFE9E3; --ld-2: #D9CFC7; --ld-3: #C9B59C; --ld-4: #A8937A; --ld-5: #6B5A44;
  --ld-sun: #D9B98C; --ld-paper: #FFFFFF; --ld-ink: #2B241D; --ld-tagink: #2B241D;
  --font-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-display: "Bricolage Grotesque", "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F11; --surface: #131417; --surface-2: #1A1C20; --line: #2D3138;
    --fg: #ECEDEF; --muted: #A0A6B0; --accent: #C9B59C; --accent-strong: #DCCBB3; --accent-soft: #2B2620;
    --on-accent: #1A1712; --ink: #ECEDEF; --on-ink: #0E0F11;
    --shadow: 0 24px 60px -30px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.35);
    --ld-sky: #101216; --ld-1: #2D3138; --ld-2: #23262C; --ld-3: #1A1D21; --ld-4: #131518; --ld-5: #0B0C0E;
    --ld-sun: #C9B59C; --ld-paper: #23262C; --ld-ink: #ECEDEF; --ld-tagink: #1A1712;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F11; --surface: #131417; --surface-2: #1A1C20; --line: #2D3138;
  --fg: #ECEDEF; --muted: #A0A6B0; --accent: #C9B59C; --accent-strong: #DCCBB3; --accent-soft: #2B2620;
  --on-accent: #1A1712; --ink: #ECEDEF; --on-ink: #0E0F11;
  --shadow: 0 24px 60px -30px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.35);
  --ld-sky: #101216; --ld-1: #2D3138; --ld-2: #23262C; --ld-3: #1A1D21; --ld-4: #131518; --ld-5: #0B0C0E;
  --ld-sun: #C9B59C; --ld-paper: #23262C; --ld-ink: #ECEDEF; --ld-tagink: #1A1712;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--surface); color: var(--fg); font: 400 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 8px; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.in { width: 100%; max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- umumiy elementlar ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; font-size: 14px; text-decoration: none; transition: transform .15s, box-shadow .15s, background .15s; white-space: nowrap; }
.btn-main { background: var(--accent); color: var(--on-accent); }
.btn-main:hover { box-shadow: 0 12px 24px -12px var(--accent); transform: translateY(-1px); }
.btn-line { background: color-mix(in srgb, var(--surface) 78%, transparent); border-color: var(--line); color: var(--fg); }
.btn-line:hover { background: var(--surface); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 78%, transparent); display: inline-grid; place-items: center; color: var(--fg); }
.icon-btn:hover { background: var(--surface); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font: 700 11px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
.tag.yangilik { background: var(--accent); color: var(--on-accent); }
.tag.ozgarish { border: 1.5px solid var(--accent-strong); color: var(--accent-strong); }
.tag.malumot { background: var(--accent-soft); color: var(--accent-strong); }
.date { font: 500 12px/1 var(--font-mono); letter-spacing: .04em; color: var(--muted); }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; min-height: 640px; display: flex; background: var(--ld-sky); color: var(--fg); }
.scenes { position: absolute; inset: 0; overflow: hidden; }
.sc { position: absolute; inset: 0; overflow: hidden; background: var(--ld-sky); transition: transform 1s cubic-bezier(.77, 0, .18, 1); }
.sc svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 1s cubic-bezier(.77, 0, .18, 1); }
.sc.p0 { transform: none; } .sc.p0 svg { transform: none; }
.sc.p1 { transform: translateY(100%); } .sc.p1 svg { transform: translateY(-30%); }
.sc.p2 { transform: translateY(-100%); } .sc.p2 svg { transform: translateY(30%); }
.sc.snap, .sc.snap svg { transition: none; }
.sc .f1 { fill: var(--ld-1); } .sc .f2 { fill: var(--ld-2); } .sc .f3 { fill: var(--ld-3); }
.sc .f4 { fill: var(--ld-4); } .sc .f5 { fill: var(--ld-5); } .sc .fp { fill: var(--ld-paper); }
.sc .fsun { fill: var(--ld-sun); }
.sc .sk { stroke: var(--ld-5); stroke-width: 2; fill: none; stroke-linecap: round; }
.sc .fb { fill: none; stroke: var(--ld-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.sc .tt { font: 700 13px var(--font-mono); fill: var(--ld-tagink); }
.shade { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(90deg, var(--ld-sky) 0%, color-mix(in srgb, var(--ld-sky) 84%, transparent) 32%, transparent 64%),
  linear-gradient(0deg, color-mix(in srgb, var(--ld-sky) 90%, transparent), transparent 26%); }
.hero-in { position: relative; z-index: 2; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; padding-block: 20px 22px; }
.top { display: flex; align-items: center; gap: 10px; }
.mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: #2B241D; color: #D4B896; box-shadow: inset 0 0 0 1px rgba(212,184,150,.18); }
.mark .ico { width: 28px; height: 28px; }
.brand { font: 700 19px/1 var(--font-display); letter-spacing: -.01em; text-decoration: none; }
.top nav { margin-left: 28px; display: flex; gap: 4px; }
.top nav a { padding: 8px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; color: var(--muted); }
.top nav a:hover { color: var(--fg); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.top .grow { flex: 1; }
.slides { display: grid; max-width: 760px; }
.hs { grid-area: 1 / 1; min-width: 0; }
/* Belgi va sana ham sarlavha kabi almashadi: eski slaydniki tez so'nadi, yangisi sarlavhadan oldin chiqadi — ustma-ust tushmaydi */
.hs .meta { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; opacity: 0; transform: translateY(8px); transition: opacity .5s .55s, transform .5s .55s; }
.hs.on .meta { opacity: 1; transform: none; }
.hs.off .meta { opacity: 0; transition-duration: .2s; transition-delay: 0s; }
.hs.intro .meta { transition: none; }
.ht { margin: 0; font: 400 var(--fs, clamp(44px, 7.6vw, 104px))/.95 var(--font-serif); letter-spacing: -.02em; text-wrap: balance; }
.ht[data-s="s"] { --fs: clamp(56px, 10vw, 132px); }
.ht[data-s="l"] { --fs: clamp(36px, 5.6vw, 76px); }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: .05em .03em .14em 0; margin-bottom: -.12em; }
.wi { display: inline-block; transform: translateY(108%); transition: transform .9s cubic-bezier(.2, .8, .2, 1) calc(280ms + var(--k) * 60ms); }
.hs.on .wi { transform: none; }
.hs.off .wi { transform: translateY(-160%); transition: transform .6s cubic-bezier(.7, 0, .84, 0) calc(var(--k) * 30ms); }
.hs.off { visibility: hidden; transition: visibility 0s 1.3s; }
.hs:not(.on):not(.off) { visibility: hidden; }
.hs p { margin: 20px 0 0; max-width: 46ch; color: var(--muted); font-size: 16px; opacity: 0; transform: translateY(12px); transition: opacity .6s .8s, transform .6s .8s; }
.hs .acts { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; opacity: 0; transform: translateY(12px); transition: opacity .6s .95s, transform .6s .95s; }
.hs.on p, .hs.on .acts { opacity: 1; transform: none; }
.hs.intro p, .hs.intro .acts { transition: none; }
.hs.on.intro .wi { animation: introrise .9s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(100ms + var(--k) * 60ms); }
@keyframes introrise { from { transform: translateY(108%); } }
.hs.off p, .hs.off .acts { opacity: 0; transition-duration: .3s; transition-delay: 0s; }
.ctl { display: flex; align-items: center; gap: 14px; }
.cnt { font: 500 13px/1 var(--font-mono); letter-spacing: .06em; color: var(--muted); min-width: 56px; }
.segs { display: flex; gap: 6px; flex: 1; max-width: 340px; }
.seg { flex: 1; height: 24px; display: flex; align-items: center; padding: 0; border: 0; background: transparent; }
.seg b { display: block; width: 100%; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 18%, transparent); overflow: hidden; }
.seg i { display: block; height: 100%; background: var(--fg); transform-origin: left; transform: scaleX(0); }
.seg.done i { transform: scaleX(1); }
.seg.on i { animation: fillseg var(--dur, 7s) linear forwards; }
.hero:hover .seg.on i, .hero:focus-within .seg.on i { animation-play-state: paused; }
@keyframes fillseg { to { transform: scaleX(1); } }
.ctl .grow { flex: 1; }

/* sahna animatsiyalari */
.halo { transform-box: fill-box; transform-origin: center; animation: pulse 4.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .5; } }
.cl { animation: drift 28s linear infinite alternate; }
@keyframes drift { to { transform: translateX(110px); } }
.bd { animation: fly 16s linear infinite; animation-delay: calc(var(--d) * -1s); }
@keyframes fly { from { transform: translate(-160px, 0); } to { transform: translate(1500px, -90px); } }
.beam { transform-origin: 860px 260px; animation: rock 3.2s ease-in-out infinite alternate; }
.pan-l { transform-origin: 710px 262px; animation: rockr 3.2s ease-in-out infinite alternate; }
.pan-r { transform-origin: 1010px 262px; animation: rockr 3.2s ease-in-out infinite alternate; }
@keyframes rock { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
@keyframes rockr { from { transform: rotate(5deg); } to { transform: rotate(-5deg); } }
.wv { animation: wave 9s ease-in-out infinite alternate; }
@keyframes wave { to { transform: translateX(-60px); } }
.pg { transform-box: fill-box; transform-origin: center; animation: bob 6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-14px) rotate(1.2deg); } }
.ct { animation: rise2 5s ease-in-out infinite; animation-delay: calc(var(--d) * -1s); }
@keyframes rise2 { 0% { transform: translateY(40px); opacity: 0; } 20%, 70% { opacity: 1; } 100% { transform: translateY(-80px); opacity: 0; } }

/* ---------- raqamlar ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; }
.stat { padding: 20px 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); }
.stat b { display: block; font: 400 44px/1 var(--font-serif); letter-spacing: -.02em; }
.srcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.src-card { padding: 20px 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, box-shadow .2s; }
.src-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.src-card b { display: block; font: 400 40px/1 var(--font-serif); letter-spacing: -.02em; }
.src-card h3 { margin: 10px 0 6px; font: 600 16px/1.3 var(--font-display); }
.src-card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
.src-note { margin: 18px 0 0; max-width: 78ch; color: var(--muted); font-size: 13px; line-height: 1.6; }
.src-note a { color: var(--accent-strong); font-weight: 600; }
.stat span { display: block; margin-top: 8px; color: var(--muted); font-size: 13.5px; }

/* ---------- bo'limlar ---------- */
.band { padding-block: 72px; }
.band.alt { background: var(--surface-2); border-block: 1px solid var(--line); }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 30px; }
.sec-head h2 { margin: 0; font: 400 clamp(36px, 5vw, 56px)/1 var(--font-serif); letter-spacing: -.02em; }
.sec-head p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, box-shadow .2s; scroll-margin-top: 24px; }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.card.flash, .row.flash, .info.flash { border-color: var(--accent-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
.card .meta, .row .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card h3 { margin: 4px 0 0; font: 600 21px/1.25 var(--font-display); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.card p, .row p, .info p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.more { margin-top: 2px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--fg); white-space: pre-line; overflow-wrap: anywhere; }
.card-foot { margin-top: auto; padding-top: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; border: 0; background: transparent; font-weight: 700; font-size: 13.5px; color: var(--accent-strong); text-decoration: none; }
.link-btn:hover { text-decoration: underline; }
.link-btn .ico { width: 15px; height: 15px; transition: transform .2s; }
.link-btn[aria-expanded="true"] .ico { transform: rotate(90deg); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; display: grid; gap: 14px; max-width: 820px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.row { position: relative; display: grid; gap: 6px; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); scroll-margin-top: 24px; }
.row::before { content: ""; position: absolute; left: -26px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent-strong); }
.row h3 { margin: 0; font: 600 18px/1.3 var(--font-display); overflow-wrap: anywhere; }
.infos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 28px 48px; }
.info { display: grid; gap: 10px; align-content: start; padding-top: 18px; border-top: 2px solid var(--fg); scroll-margin-top: 24px; }
.info h3 { margin: 0; font: 400 32px/1.1 var(--font-serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
.info .meta { display: flex; align-items: center; gap: 10px; }
.empty { padding: 28px; border: 1.5px dashed var(--line); border-radius: 18px; color: var(--muted); text-align: center; }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 34px; border-radius: 26px; background: var(--ink); color: var(--on-ink); }
.cta h2 { margin: 0; font: 400 clamp(30px, 4vw, 44px)/1.05 var(--font-serif); max-width: 20ch; }
.cta p { margin: 8px 0 0; opacity: .75; max-width: 46ch; }
footer { padding-block: 34px 44px; background: var(--bg); border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .in { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; }
footer a { color: var(--accent-strong); font-weight: 600; }
footer .credits { flex-basis: 100%; margin: 6px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.7; }
footer .credits a { font-weight: 500; }

/* ---------- suratlar ---------- */
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.shot { margin: 0; min-width: 0; }
.shot.wide { grid-column: 1 / -1; }
.shot .frame { overflow: hidden; border-radius: 20px; border: 1px solid var(--line); background: var(--surface-2); aspect-ratio: 16 / 9; }
.shot.wide .frame { aspect-ratio: 2.2 / 1; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
.shot:hover img { transform: scale(1.03); }
.shot figcaption { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; padding: 10px 4px 0; }
.shot figcaption b { font: 600 15px/1.3 var(--font-display); }
.shot figcaption small { color: var(--muted); font-size: 12px; }
.shot figcaption a { color: var(--accent-strong); }

@media (max-width: 760px) {
  .top nav { display: none; }
  .hero { min-height: 600px; }
  .shade { background: linear-gradient(180deg, var(--ld-sky) 0%, color-mix(in srgb, var(--ld-sky) 92%, transparent) 55%, transparent 88%), linear-gradient(0deg, color-mix(in srgb, var(--ld-sky) 90%, transparent), transparent 22%); }
  .band { padding-block: 52px; }
  .shots { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .shot.wide .frame { aspect-ratio: 16 / 9; }
  .cta { padding: 26px; }
  .top .btn-line .lbl { display: none; }
  .top .btn-line { padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
  .seg.on i { transform: scaleX(1); }
}
</style>
<script src="/static/pwa.js" defer></script>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    h("div", { class: "sec-head" }, h("div", null, h("h2", null, "Yangiliklar"), h("p", null, "Qonunnoma loyihasidagi eʼlonlar va xabarlar."))),
    h("div", { class: "grid", id: "newsGrid" }))),
  h("section", { class: "band", id: "changes" }, h("div", { class: "in" },
    h("div", { class: "sec-head" }, h("div", null, h("h2", null, "Oʻzgarishlar jurnali"), h("p", null, "Sahifa va tizimda nima oʻzgargani, sanasi bilan."))),
    h("ol", { class: "timeline", id: "log" }))),
  h("section", { class: "band alt", id: "info" }, h("div", { class: "in" },
    h("div", { class: "sec-head" }, h("div", null, h("h2", null, "Maʼlumot"), h("p", null, "Tizimdan foydalanish uchun qisqa maʼlumotlar."))),
    h("div", { class: "infos", id: "infos" }),
    h("div", { class: "cta", style: "margin-top:56px" },
      h("div", null, h("h2", null, "Savolingiz bormi?"), h("p", null, "Qonun boʻyicha savol bering, javob yonida manba koʻrsatiladi.")),
      h("a", { class: "btn btn-main", href: CHAT_URL }, "Savol berish", ico("r"))))),
  h("footer", null, h("div", { class: "in" },
    h("span", null, "© 2026 Qonunnoma. Javoblar yuridik maslahat oʻrnini bosmaydi."),
    h("span", null, "Rasmiy matn: ", h("a", { href: "https://lex.uz", target: "_blank", rel: "noopener" }, "lex.uz")),
    h("p", { class: "credits" }, "Suratlar: ", h("a", { href: "https://commons.wikimedia.org", target: "_blank", rel: "noopener" }, "Wikimedia Commons"),
      ". Oʻlchami oʻzgartirilgan va kesilgan. ", PHOTOS.flatMap((p, i) => [i ? "; " : "", `${p.title} — `, h("a", { href: p.page, target: "_blank", rel: "noopener" }, p.by), ", ", licenseLink(p)]))))
);

/* ---------- kartalar ---------- */
function moreBlock(it) {
  if (!it.more) return [null, null];
  const box = h("div", { class: "more", hidden: true, id: "m-" + it.id }, it.more);
  const btn = h("button", { type: "button", class: "link-btn", "aria-expanded": "false", "aria-controls": "m-" + it.id, onclick: () => toggleMore(it.id) }, "Batafsil", ico("chev"));
  return [box, btn];
}
function toggleMore(id, force) {
  const box = document.getElementById("m-" + id), btn = document.querySelector('[aria-controls="m-' + id + '"]'); if (!box) return;
  const open = force == null ? box.hidden : force; box.hidden = !open; if (btn) btn.setAttribute("aria-expanded", String(open));
}
const linkEl = it => safeUrl(it.link) ? h("a", { class: "link-btn", href: it.link, target: "_blank", rel: "noopener" }, "Havola", ico("ext")) : null;
function newsCard(it) {
  const [box, btn] = moreBlock(it);
  return h("article", { class: "card", id: "n-" + it.id },
    h("div", { class: "meta" }, h("span", { class: "tag " + it.cat }, CATS[it.cat] || "Eʼlon"), h("span", { class: "date" }, fmtDate(it.date))),
    h("h3", null, it.title), h("p", null, it.text), box,
    (btn || safeUrl(it.link)) ? h("div", { class: "card-foot" }, btn, linkEl(it)) : null);
}
function logRow(it) {
  const [box, btn] = moreBlock(it);
  return h("li", { class: "row", id: "n-" + it.id },
    h("div", { class: "meta" }, h("span", { class: "date" }, fmtDate(it.date))),
    h("h3", null, it.title), h("p", null, it.text), box,
    (btn || safeUrl(it.link)) ? h("div", { class: "card-foot", style: "padding-top:2px" }, btn, linkEl(it)) : null);
}
function infoBlock(it) {
  const [box, btn] = moreBlock(it);
  return h("article", { class: "info", id: "n-" + it.id },
    h("div", { class: "meta" }, h("span", { class: "date" }, fmtDate(it.date))),
    h("h3", null, it.title), h("p", null, it.text), box,
    (btn || safeUrl(it.link)) ? h("div", { class: "card-foot", style: "padding-top:2px" }, btn, linkEl(it)) : null);
}
const emptyBox = t => h("div", { class: "empty" }, t);
function renderLists() {
  const items = sorted(), by = c => items.filter(i => i.cat === c);
  const fill = (id, list, mk, empty) => { $(id).replaceChildren(...(list.length ? list.map(mk) : [emptyBox(empty)])); };
  fill("#newsGrid", by("yangilik"), newsCard, "Hozircha yangilik yoʻq.");
  fill("#log", by("ozgarish"), logRow, "Hozircha oʻzgarishlar yozilmagan.");
  fill("#infos", by("malumot"), infoBlock, "Hozircha maʼlumot qoʻshilmagan.");
}

/* ---------- hero ---------- */
let slides = [], cur = 0, scEls = [];
function slideEl(it) {
  const len = it.title.length, size = len <= 20 ? "s" : len <= 40 ? "m" : "l";
  const t = h("h2", { class: "ht", "data-s": size, "aria-label": it.title });
  it.title.split(/\s+/).forEach((w, k, arr) => {
    const sp = h("span", { class: "wi", "aria-hidden": "true", style: "--k:" + k }, w);
    t.append(h("span", { class: "w" }, sp)); if (k < arr.length - 1) t.append(" ");
  });
  return h("div", { class: "hs" },
    h("div", { class: "meta" }, h("span", { class: "tag " + it.cat }, CATS[it.cat] || "Eʼlon"), h("span", { class: "date" }, fmtDate(it.date))),
    t, h("p", null, it.text),
    h("div", { class: "acts" },
      h("a", { class: "btn btn-main", href: CHAT_URL }, ico("chat"), "Savol berish"),
      h("button", { class: "btn btn-line", type: "button", onclick: () => jumpTo(it) }, "Batafsil", ico("r"))));
}
function jumpTo(it) {
  const el = document.getElementById("n-" + it.id); if (!el) return;
  toggleMore(it.id, true); el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800);
}
function buildHero() {
  slides = sorted().slice(0, 3);
  const sc = $("#scenes"), sl = $("#slides"), sg = $("#segs");
  $("#ctl").style.display = slides.length > 1 ? "" : "none";
  for (let k = 0; k < 3; k++) { const d = h("div", { class: "sc p" + k }); d.innerHTML = ART[k](); sc.append(d); }
  scEls = [...sc.children];
  slides.forEach((it, k) => {
    sl.append(slideEl(it));
    sg.append(h("button", { type: "button", class: "seg", "aria-label": (k + 1) + "-eʼlon", onclick: () => go(k) }, h("b", null, h("i", null))));
  });
  [...sg.querySelectorAll("i")].forEach(i => { i.style.setProperty("--dur", SLIDE_MS + "ms"); i.addEventListener("animationend", () => { if (slides.length > 1) go((cur + 1) % slides.length); }); });
  show(0, true);
}
function show(i, first) {
  const prev = cur; cur = i;
  scEls.forEach((s, k) => {
    const pos = (((k - i) % 3) + 3) % 3, was = (((k - prev) % 3) + 3) % 3;
    const snap = !first && was !== 0 && pos !== 0 && was !== pos;
    s.className = "sc p" + pos + (snap ? " snap" : "");
    if (snap) requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove("snap")));
  });
  [...$("#slides").children].forEach((el, k) => {
    el.classList.toggle("on", k === i);
    el.classList.toggle("off", k !== i && k === prev && !first);
    el.classList.toggle("intro", !!first && k === 0);
  });
  [...$("#segs").children].forEach((b, k) => { b.classList.toggle("done", k < i); b.classList.remove("on"); void b.offsetWidth; b.classList.toggle("on", k === i); });
  $("#cnt").textContent = "0" + (i + 1) + " / 0" + slides.length;
}
function go(i) { if (i === cur || !slides.length) return; show(i, false); }
$("#prev").onclick = () => go((cur - 1 + slides.length) % slides.length);
$("#next").onclick = () => go((cur + 1) % slides.length);

/* ---------- mavzu (chat sahifasi bilan bir xil kalit) ---------- */
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const paintTheme = () => $("#theme use").setAttribute("href", isDark() ? "#i-sun" : "#i-moon");
$("#theme").onclick = () => { const n = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("qn-theme", n); } catch (e) {} paintTheme(); };
try { const t = localStorage.getItem("qn-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
paintTheme();

renderLists(); buildHero();
</script>
